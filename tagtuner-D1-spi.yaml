# TagTuner on a Wemos D1 mini ESP32, PN532 over SPI.
# Same board as tagtuner-D1-custom1.yaml; only the PN532 bus differs.
# Set the PN532 breakout jumpers to SPI.
#
# Wiring: SCK->22 (yellow), MOSI->21 (blue), MISO->27 (green), SS/CS->16 (white)

substitutions:
  led_pin: "2"
  toggle_pin: "23"
  rotary_pin_a: "18"
  rotary_pin_b: "19"
  nfc_cs_pin: "16"

packages:
  # project: github://luka6000/TagTuner/tagtuner-project.yaml@main
  # core-nfc: github://luka6000/TagTuner/tagtuner-core-nfc-spi.yaml@main
  # core-comms: github://luka6000/TagTuner/tagtuner-core-comms.yaml@main
  project: !include tagtuner-project.yaml
  core-nfc: !include tagtuner-core-nfc-spi.yaml
  core-comms: !include tagtuner-core-comms.yaml
  core-controls: !include tagtuner-core-controls.yaml
  core-led1: !include tagtuner-core-led1-binary.yaml

esp32:
  board: wemos_d1_mini32
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_PM_ENABLE: 'Y'
      CONFIG_PM_DFS_INIT_AUTO: 'Y'
      CONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ_80: 'Y'

# To be able to get logs from the device via serial and api.
logger:
  # level: VERBOSE
  level: DEBUG
  # level: WARN
  logs:
    light: WARN
    # pn532: DEBUG
    # pn532_spi: DEBUG

spi:
  clk_pin: 22
  mosi_pin: 21
  miso_pin: 27

esp32_ble_tracker:
  scan_parameters:
    active: false
bluetooth_proxy:
  active: false
