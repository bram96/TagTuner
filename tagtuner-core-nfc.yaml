# TagTuner NFC core over I2C.
# Kept at this filename so existing configs and dashboard imports that do
#   core-nfc: !include tagtuner-core-nfc.yaml
# keep working unchanged. Everything not bus-specific is in
# tagtuner-core-nfc-base.yaml; the SPI twin is tagtuner-core-nfc-spi.yaml.
#
# Expects an i2c bus with id ${nfc_i2c_id} in the device config.

substitutions:
  nfc_i2c_id: bus_i2c
  nfc_update_interval: 350ms

packages:
  core-nfc-base: !include tagtuner-core-nfc-base.yaml

pn532_i2c:
  - id: pn532_board
    i2c_id: ${nfc_i2c_id}
    update_interval: ${nfc_update_interval}
    on_tag: !include tagtuner-nfc-on-tag.yaml
    on_tag_removed: !include tagtuner-nfc-on-tag-removed.yaml
